title: SSC archive
description: Date-stamped snapshots of the SSC archive, with a browsable list of the packages in each

theme: just-the-docs

# The site is served from GitHub *project* Pages, i.e. under a path
# prefix rather than at the host root. `url` is the origin only; the
# prefix belongs in `baseurl`, and omitting it makes every theme asset
# link resolve to the host root and 404 -- an entirely unstyled site.
url: "https://ssc-ng.net"
baseurl: "/archive"

search_enabled: false
color_scheme: light

nav_external_links:
  - title: GitHub
    url: https://github.com/ssc-ng/archive
    hide_icon: false
  - title: ssc2
    url: https://ssc-ng.net/ssc2/
    hide_icon: false

exclude:
  - DEPLOY-PREVIEW.md
  - build_data.py
  - Gemfile
  - Gemfile.lock

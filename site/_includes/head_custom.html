<!-- just-the-docs injects this file into <head> on every page
     (https://just-the-docs.com/docs/customization/#custom-head).

     The browser script lives in an external asset because the theme pipes
     page HTML through jekyll-compress-html, whose whitespace collapse does
     not exempt inline <script> contents. Only pages that opt in via
     `browser: true` front matter load it; `defer` runs it after the
     document is parsed. The data it needs is NOT embedded: it is fetched
     asynchronously from assets/data/ (see build_data.py). -->
{% if page.browser %}
<script>window.REPO_URL = {{ site.repo_url | jsonify }}; window.PKG_ROOT = {{ site.pkg_root | jsonify }};</script>
<script>window.DATA_BASE = "{{ '/assets/data/' | relative_url }}";</script>
<script src="{{ '/assets/js/browser.js' | relative_url }}" defer></script>
{% endif %}
